<div x-data="visualizeApp()">
  <!-- Header -->
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Crash Scene Diagram</h1>
    <p class="mt-1 text-gray-500">Generate a 2D visualization of vehicle positions and impact point</p>
  </div>

  <!-- Vehicle Inputs - Two Columns -->
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
    <!-- Vehicle 1 -->
    <div class="bg-white rounded-lg shadow border-t-4 border-blue-500 p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">
        <i class="fas fa-car text-blue-500 mr-2"></i>Vehicle 1
      </h2>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">X Position (ft)</label>
            <input type="number" x-model="v1.x"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Y Position (ft)</label>
            <input type="number" x-model="v1.y"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Heading (deg, 0=east, 90=north)</label>
          <input type="number" x-model="v1.heading"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Length (ft)</label>
            <input type="number" x-model="v1.length" step="0.5"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Width (ft)</label>
            <input type="number" x-model="v1.width" step="0.5"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Label</label>
          <input type="text" x-model="v1.label"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
    </div>

    <!-- Vehicle 2 -->
    <div class="bg-white rounded-lg shadow border-t-4 border-red-500 p-6">
      <h2 class="text-lg font-semibold text-gray-800 mb-4">
        <i class="fas fa-car text-red-500 mr-2"></i>Vehicle 2
      </h2>
      <div class="space-y-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">X Position (ft)</label>
            <input type="number" x-model="v2.x"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Y Position (ft)</label>
            <input type="number" x-model="v2.y"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Heading (deg, 0=east, 90=north)</label>
          <input type="number" x-model="v2.heading"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Length (ft)</label>
            <input type="number" x-model="v2.length" step="0.5"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Width (ft)</label>
            <input type="number" x-model="v2.width" step="0.5"
                   class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Label</label>
          <input type="text" x-model="v2.label"
                 class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
        </div>
      </div>
    </div>
  </div>

  <!-- Impact Point -->
  <div class="bg-white rounded-lg shadow p-6 mb-6">
    <h2 class="text-lg font-semibold text-gray-800 mb-4">
      <i class="fas fa-crosshairs text-red-500 mr-2"></i>Impact Point (optional)
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Impact X (ft)</label>
        <input type="number" x-model="impactX"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Impact Y (ft)</label>
        <input type="number" x-model="impactY"
               class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
      </div>
    </div>
  </div>

  <!-- Generate Button -->
  <div class="flex flex-wrap gap-3 mb-6">
    <button @click="generate()"
            class="px-6 py-2.5 bg-green-600 text-white font-medium rounded-lg hover:bg-green-700 focus:ring-2 focus:ring-green-500 focus:ring-offset-2 transition-colors">
      <i class="fas fa-map mr-2"></i>Generate Diagram
    </button>
    <button @click="reset()"
            class="px-6 py-2.5 bg-white text-gray-700 font-medium rounded-lg border border-gray-300 hover:bg-gray-50 focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 transition-colors">
      <i class="fas fa-undo mr-2"></i>Reset
    </button>
  </div>

  <!-- Loading -->
  <div x-show="loading" class="flex items-center justify-center py-12">
    <div class="flex items-center space-x-3">
      <i class="fas fa-spinner fa-spin text-2xl text-blue-600"></i>
      <span class="text-gray-600 text-lg">Generating diagram...</span>
    </div>
  </div>

  <!-- Error -->
  <div x-show="error" x-cloak
       class="mb-6 p-4 bg-red-50 border border-red-200 rounded-lg flex items-start">
    <i class="fas fa-exclamation-circle text-red-500 mt-0.5 mr-3"></i>
    <span class="text-red-700" x-text="error"></span>
  </div>

  <!-- Chart Output -->
  <div class="bg-white rounded-lg shadow p-4">
    <div id="scene-chart" class="h-96"></div>
  </div>
</div>
