[build-system]
requires = ["setuptools>=68.0,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrash-ai"
version = "0.1.0"
description = "AI-powered vehicle crash reconstruction platform"
readme = "README.md"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.9"
authors = [
    {name = "Joe Cormier", email = "joemcormier@outlook.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "pycrash>=0.0.18",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=0.39",
    "openai>=1.30",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "PyMuPDF>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.27",
    "ruff>=0.1",
]

[project.urls]
Homepage = "https://github.com/hordruma/pycrash-ai"
Repository = "https://github.com/hordruma/pycrash-ai"

[project.scripts]
pycrash-ai = "pycrash_ai.cli:main"

[tool.setuptools.packages.find]
include = ["pycrash_ai*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["pycrash_ai"]
