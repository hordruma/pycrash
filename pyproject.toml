[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pycrash"
version = "0.0.18"
description = "2D vehicle crash simulation and accident reconstruction tool"
readme = "README.md"
license = "GPL-3.0-only"
requires-python = ">=3.9"
authors = [
    {name = "Joe Cormier", email = "joemcormier@outlook.com"},
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering",
]
keywords = ["crash", "simulation", "vehicle", "accident", "reconstruction", "forensic", "physics"]

dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.11",
    "matplotlib>=3.7",
    "plotly>=5.15",
    "scikit-learn>=1.3",
    "cookiecutter>=2.3",
    "joblib>=1.3",
    "dash>=2.14",
    "tabulate>=0.9",
    "openpyxl>=3.1",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
    "httpx>=0.27",
]
notebook = [
    "jupyter>=1.0",
    "jupyterlab>=4.0",
    "ipywidgets>=8.0",
]
ai = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "celery[redis]>=5.4",
    "redis>=5.0",
    "anthropic>=0.39",
    "openai>=1.30",
    "weasyprint>=62.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "PyMuPDF>=1.24",
]

[project.urls]
Homepage = "https://github.com/joe-cormier/pycrash"
Repository = "https://github.com/joe-cormier/pycrash"
Issues = "https://github.com/joe-cormier/pycrash/issues"

[project.scripts]
pycrash = "pycrash.cli:main"

[tool.setuptools.packages.find]
include = ["pycrash*", "pycrash_ai*"]
exclude = ["__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py39"
line-length = 120
